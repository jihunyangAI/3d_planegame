<!doctype html>
<html lang="ko">
<head>

<style>
  :root {
    --ink: #1f2430; --muted: #6b7280; --panel: rgba(255,255,255,.9);
    --line: rgba(31,36,48,.12); --accent: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd9e3;
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--ink); }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .panel { position: fixed; background: var(--panel); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 24px rgba(31,36,48,.12); }
  #info { top: 16px; left: 16px; padding: 14px 16px; width: 270px; }
  #info h1 { margin: 0 0 2px; font-size: 17px; letter-spacing: -.02em; padding-right: 30px; }
  #b-hide { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; flex: none; padding: 0; font-size: 15px; line-height: 1; }
  #b-show { position: fixed; top: 16px; left: 16px; width: auto; flex: none; padding: 8px 12px; display: none;
    box-shadow: 0 6px 24px rgba(31,36,48,.12); }
  body.ui-hidden #info, body.ui-hidden #help { display: none; }
  body.ui-hidden #b-show { display: block; }
  #info .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  #stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  #stats div { background: rgba(31,36,48,.05); border-radius: 8px; padding: 6px 4px; text-align: center; }
  #stats b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  #stats span { font-size: 10.5px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  .row output { width: 42px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .presets { display: flex; gap: 6px; margin-top: 6px; }
  #legend { margin-top: 10px; display: none; }
  .legend-title { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  #ramp { height: 10px; border-radius: 5px; }
  .ramp-ticks { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .toggles { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; font-size: 12.5px; }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .toggles input { accent-color: var(--accent); margin: 0; }
  .btns { display: flex; gap: 6px; margin-top: 12px; }
  button { flex: 1; font: inherit; font-size: 12px; padding: 7px 4px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer; }
  button:hover { background: #f3f4f6; }
  #help { bottom: 16px; left: 16px; padding: 8px 12px; font-size: 11.5px; color: var(--muted); }
  #credit { bottom: 16px; right: 16px; padding: 6px 10px; font-size: 10.5px; color: var(--muted); }
  #credit a { color: inherit; }
  #tip { position: fixed; pointer-events: none; padding: 7px 10px; font-size: 12px; display: none; z-index: 5; white-space: nowrap; }
  #tip b { display: block; font-size: 13px; }
  #tip span { color: var(--muted); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #cfd9e3; font-size: 14px; color: var(--muted); z-index: 10; }
  .lbl { font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; pointer-events: none;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 4px rgba(0,0,0,.8), 0 1px 2px #000; }
  .lbl.road { font-weight: 500; color: #e8ecf2; font-size: 10.5px; }
  .lbl.park { color: #c9f3c7; }
  .exit { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid #1e9e57; color: #14753f;
    font-size: 10.5px; font-weight: 700; display: grid; place-items: center; pointer-events: none; }
  .station { background: #1e9e57; color: #fff; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 10px;
    pointer-events: none; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .here { background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 14px;
    pointer-events: none; white-space: nowrap; box-shadow: 0 3px 10px rgba(229,72,77,.45); }
  .compass { font-size: 13px; font-weight: 800; color: #ff6b6f; pointer-events: none; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .ringlbl { font-size: 11px; font-weight: 600; color: #ff6b6f; pointer-events: none; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  @media (max-width: 640px) {
    #info { width: auto; right: 16px; padding: 10px 12px; }
    #stats, #legend { display: none !important; }
    #help { display: none; }
  }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Sky } from 'three/addons/objects/Sky.js';

const D = window.MAP_DATA;
const R = D.radius;
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const { smoothstep, lerp, clamp } = THREE.MathUtils;

// 결정적 난수 (건물마다 항상 같은 모양이 나오도록)
function rng(seed) { let s = (seed * 2654435761) >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const pickFrom = (arr, r) => arr[Math.min(arr.length - 1, Math.floor(r * arr.length))];

// ---------- 기본 장면 ----------
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc4d0db, 2200, 9000);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 2, 60000);
const HOME = { pos: new THREE.Vector3(-1000, 1150, 1700), target: new THREE.Vector3(0, 0, 0) };
camera.position.copy(HOME.pos);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'absolute', top: 0, left: 0, pointerEvents: 'none' });
app.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.minDistance = 25;
controls.maxDistance = 4500;
controls.autoRotateSpeed = 0.6;
controls.target.copy(HOME.target);

const hemi = new THREE.HemisphereLight(0xdfeaff, 0x8a8478, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -1150, right: 1150, top: 1150, bottom: -1150, near: 100, far: 5200 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.5;
scene.add(sun);

const sky = new Sky();
sky.scale.setScalar(40000);
scene.add(sky);
const envSky = new Sky();           // 유리창 반사용 환경맵을 굽는 데 쓰는 사본
envSky.scale.setScalar(40000);
const envScene = new THREE.Scene();
envScene.add(envSky);
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;

// 지도 좌표(x=동, y=북, 미터) -> three.js (x, 높이, -y)
const P = (x, y, h = 0) => new THREE.Vector3(x, h, -y);

function centroid(f) { let x = 0, y = 0; const n = f.length / 2; for (let i = 0; i < n; i++) { x += f[2 * i]; y += f[2 * i + 1]; } return [x / n, y / n]; }
function signedArea(f) { let a = 0; const n = f.length / 2; for (let i = 0; i < n; i++) { const j = (i + 1) % n; a += f[2 * i] * f[2 * j + 1] - f[2 * j] * f[2 * i + 1]; } return a / 2; }
const areaOf = f => Math.abs(signedArea(f));
function inPoly(x, y, f) {
  let inside = false; const n = f.length / 2;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = f[2 * i], yi = f[2 * i + 1], xj = f[2 * j], yj = f[2 * j + 1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// ---------- 지면 ----------
const groundMat = new THREE.MeshLambertMaterial({ color: 0xbfbbb3 });
const outerMat = new THREE.MeshBasicMaterial({ color: 0xb7c6d6, fog: false });
{
  const outer = new THREE.Mesh(new THREE.RingGeometry(R + 5, 30000, 96, 1), outerMat);
  outer.rotation.x = -Math.PI / 2; outer.position.y = -0.8;
  scene.add(outer);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(R, 128), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
  scene.add(ground);
  const ring = new THREE.Mesh(new THREE.RingGeometry(R, R + 5, 160), new THREE.MeshBasicMaterial({ color: 0xe5484d }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.3;
  scene.add(ring);
}

// ---------- 녹지 / 수면 ----------
function shapeFrom(flat) {
  const a = []; for (let i = 0; i < flat.length; i += 2) a.push(new THREE.Vector2(flat[i], flat[i + 1]));
  return new THREE.Shape(a);
}
function flatLayer(polys, color, y) {
  const geos = [];
  for (const f of polys) {
    try { const g = new THREE.ShapeGeometry(shapeFrom(f)); if (g.attributes.position.count) geos.push(g); } catch (e) {}
  }
  if (!geos.length) return;
  const m = new THREE.Mesh(mergeGeometries(geos), new THREE.MeshLambertMaterial({ color }));
  m.rotation.x = -Math.PI / 2; m.position.y = y; m.receiveShadow = true;
  scene.add(m);
}
flatLayer(D.greens.filter(g => g[2] === 0).map(g => g[1]), 0x7fa866, 0.05);
flatLayer(D.greens.filter(g => g[2] === 1).map(g => g[1]), 0x55793f, 0.06);
flatLayer(D.greens.filter(g => g[2] === 2).map(g => g[1]), 0xb99a6b, 0.07);   // 운동장(흙)
flatLayer(D.greens.filter(g => g[2] === 3).map(g => g[1]), 0xc9a777, 0.07);   // 놀이터
flatLayer(D.waters, 0x5d8fb5, 0.08);

// ---------- 도로 ----------
const lampPos = [];
{
  const pos = [], col = [];
  const push = (x, y, h, c) => { pos.push(x, h, -y); col.push(c.r, c.g, c.b); };
  const C = hex => new THREE.Color(hex);
  // 폴리라인을 따라 폭 2*hw 의 띠를 만든다. off 는 진행방향 오른쪽으로의 평행 이동.
  function ribbon(f, hw, h, c, joints, off = 0) {
    const n = f.length / 2;
    for (let i = 0; i < n - 1; i++) {
      let x0 = f[2 * i], y0 = f[2 * i + 1], x1 = f[2 * i + 2], y1 = f[2 * i + 3];
      const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
      if (len < 0.01) continue;
      const ux = dx / len, uy = dy / len;
      if (off) { x0 += uy * off; y0 -= ux * off; x1 += uy * off; y1 -= ux * off; }
      const nx = -uy * hw, ny = ux * hw;
      push(x0 + nx, y0 + ny, h, c); push(x0 - nx, y0 - ny, h, c); push(x1 - nx, y1 - ny, h, c);
      push(x0 + nx, y0 + ny, h, c); push(x1 - nx, y1 - ny, h, c); push(x1 + nx, y1 + ny, h, c);
      if (joints && i > 0) {
        const SEG = 8;
        for (let k = 0; k < SEG; k++) {
          const a0 = k / SEG * Math.PI * 2, a1 = (k + 1) / SEG * Math.PI * 2;
          push(x0, y0, h, c); push(x0 + Math.cos(a0) * hw, y0 + Math.sin(a0) * hw, h, c); push(x0 + Math.cos(a1) * hw, y0 + Math.sin(a1) * hw, h, c);
        }
      }
    }
  }
  // 점선 (on 미터 그리고 gap 미터 띄움)
  function dashes(f, off, hw, h, c, on = 3, gap = 5) {
    const n = f.length / 2; let carry = 0;
    for (let i = 0; i < n - 1; i++) {
      const x0 = f[2 * i], y0 = f[2 * i + 1], dx = f[2 * i + 2] - x0, dy = f[2 * i + 3] - y0, len = Math.hypot(dx, dy);
      if (len < 0.01) continue;
      const ux = dx / len, uy = dy / len;
      let s = carry;
      for (; s < len; s += on + gap) {
        const e = Math.min(len, s + on);
        ribbon([x0 + ux * s, y0 + uy * s, x0 + ux * e, y0 + uy * e], hw, h, c, false, off);
      }
      carry = s - len;
    }
  }
  // 그룹: 0 간선 1 보조간선 2 집산 3 이면도로 4 서비스 5 보행자전용 6 보도/계단
  const ASPHALT = [C(0x3e4146), C(0x414449), C(0x45484c), C(0x55575a), C(0x66676a)];
  const SIDEWALK = C(0xa9a59d), PAVER = C(0xb7a585), FOOT = C(0xb3ada1), WHITE = C(0xe9e9e4), YELLOW = C(0xd9a520);
  const Y = [0.30, 0.28, 0.26, 0.22, 0.19, 0.16, 0.13];
  for (const [grp, w, , f, oneway, lanes] of D.roads) {
    if (grp <= 2) ribbon(f, w / 2 + 3.2, 0.10, SIDEWALK, true);      // 보도
    if (grp <= 4) ribbon(f, w / 2, Y[grp], ASPHALT[grp], w >= 3);
    else if (grp === 5) ribbon(f, w / 2, Y[5], PAVER, true);
    else ribbon(f, w / 2, Y[6], FOOT, false);

    // 차선
    if (grp <= 3 && w >= 6) {
      const lw = w / Math.max(1, lanes), hM = 0.36;
      if (!oneway) {
        if (grp <= 1 && lanes >= 4) { ribbon(f, 0.1, hM, YELLOW, false, 0.22); ribbon(f, 0.1, hM, YELLOW, false, -0.22); }
        else if (grp <= 2) ribbon(f, 0.12, hM, YELLOW, false);
        else dashes(f, 0, 0.09, hM, YELLOW, 3, 3);
      }
      if (grp <= 2) for (let k = 1; k < lanes; k++) {
        if (!oneway && k * 2 === lanes) continue;                     // 중앙선 자리
        dashes(f, -w / 2 + k * lw, 0.09, hM, WHITE);
      }
    }
    // 가로등 위치
    if (grp <= 3) {
      let carry = 14, side = 1;
      for (let i = 0; i < f.length / 2 - 1; i++) {
        const x0 = f[2 * i], y0 = f[2 * i + 1], dx = f[2 * i + 2] - x0, dy = f[2 * i + 3] - y0, len = Math.hypot(dx, dy);
        if (len < 0.01) continue;
        let s = carry;
        for (; s < len; s += grp <= 2 ? 30 : 42) {
          const o = (w / 2 + 0.8) * side; side = -side;
          lampPos.push(x0 + dx / len * s + dy / len * o, grp <= 2 ? 8 : 5.5, -(y0 + dy / len * s - dx / len * o));
        }
        carry = s - len;
      }
    }
  }
  // 횡단보도 (얼룩말 무늬)
  for (const [x, y, ux, uy, w] of D.crossings) {
    const depth = w > 12 ? 6 : 4, nx = -uy, ny = ux;
    for (let o = -w / 2 + 0.6; o < w / 2 - 0.3; o += 1.1) {
      const cx = x + nx * o, cy = y + ny * o;
      ribbon([cx - ux * depth / 2, cy - uy * depth / 2, cx + ux * depth / 2, cy + uy * depth / 2], 0.3, 0.4, WHITE, false);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true }));
  m.receiveShadow = true;
  scene.add(m);

  const rp = [];
  for (const f of D.rails) for (let i = 0; i < f.length / 2 - 1; i++) rp.push(f[2 * i], 0.5, -f[2 * i + 1], f[2 * i + 2], 0.5, -f[2 * i + 3]);
  if (rp.length) {
    const rg = new THREE.BufferGeometry();
    rg.setAttribute('position', new THREE.Float32BufferAttribute(rp, 3));
    scene.add(new THREE.LineSegments(rg, new THREE.LineBasicMaterial({ color: 0x5a5e68 })));
  }
}

// 가로등 불빛 (밤에만 보임)
const lampMat = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const cx = cv.getContext('2d'), gr = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,236,190,1)'); gr.addColorStop(0.25, 'rgba(255,200,120,.55)'); gr.addColorStop(1, 'rgba(255,180,90,0)');
  cx.fillStyle = gr; cx.fillRect(0, 0, 64, 64);
  return new THREE.PointsMaterial({ map: new THREE.CanvasTexture(cv), size: 16, sizeAttenuation: true, transparent: true, opacity: 0,
    depthWrite: false, blending: THREE.AdditiveBlending, fog: false, color: 0xffd9a0 });
})();
const lampPool = lampMat.clone(); lampPool.size = 46; lampPool.color.set(0xff9c4a);
{
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(lampPos, 3));
  const pts = new THREE.Points(g, lampMat);
  pts.frustumCulled = false;
  scene.add(pts);
  const gp = new Float32Array(lampPos); for (let i = 1; i < gp.length; i += 3) gp[i] = 1.2;
  const g2 = new THREE.BufferGeometry();

  const seenPark = new Set();
  D.greens.map(g => ({ g, a: areaOf(g[1]) })).filter(o => o.g[0] && o.a > 1500).sort((a, b) => b.a - a.a).forEach(({ g }) => {
    if (seenPark.has(g[0])) return; seenPark.add(g[0]);
    const [x, y] = centroid(g[1]);
    if (!far(x, y, 70)) return;
    placed.push([x, y]);
    label(g[0], 'lbl park', P(x, y, 14), labelGroup);
  });
  const best = new Map();
  for (const [grp, , name, f] of D.roads) {
    if (!name || grp > 2) continue;
    let len = 0; for (let i = 0; i < f.length / 2 - 1; i++) len += Math.hypot(f[2 * i + 2] - f[2 * i], f[2 * i + 3] - f[2 * i + 1]);
    if (!best.has(name) || best.get(name).len < len) best.set(name, { len, f });
  }
  for (const [name, { len, f }] of best) {
    if (len < 120) continue;
    const m = Math.floor(f.length / 4) * 2;
    if (!far(f[m], f[m + 1], 60)) continue;
    placed.push([f[m], f[m + 1]]);
    label(name, 'lbl road', P(f[m], f[m + 1], 3), labelGroup);
  }
  for (const [x, y, ref] of D.exits) {
    if (Math.hypot(x, y) < 1) continue;
    label(ref || '·', 'exit', P(x, y, 6), exitGroup);
  }
  const st = new Map();
  for (const [x, y, name] of D.stations) { const s = st.get(name) || { x: 0, y: 0, n: 0 }; s.x += x; s.y += y; s.n++; st.set(name, s); }
  for (const [name, s] of st) label(name + '역', 'station', P(s.x / s.n, s.y / s.n, 38), exitGroup);

  const pin = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: 0xe5484d });
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 62, 12), mat); stem.position.y = 31;
  const head = new THREE.Mesh(new THREE.SphereGeometry(4.5, 24, 16), mat); head.position.y = 64;
  const base = new THREE.Mesh(new THREE.RingGeometry(5, 7, 48), mat); base.rotation.x = -Math.PI / 2; base.position.y = 0.6;
  pin.add(stem, head, base);
  scene.add(pin);
  label('📍 ' + D.center.name, 'here', P(0, 0, 82), fixedGroup);
  label('N', 'compass', P(0, R + 45, 2), fixedGroup);
  label('반경 1km', 'ringlbl', P(R * Math.SQRT1_2 + 30, -R * Math.SQRT1_2 - 30, 2), fixedGroup);
}

// ---------- 통계 ----------
$('s-b').textContent = D.buildings.length.toLocaleString('ko-KR');
$('s-t').textContent = D.trees.length.toLocaleString('ko-KR');
$('s-h').textContent = Math.round(Math.max(...D.buildings.map(b => b[0]))) + 'm';

// ---------- 시간대 (태양 · 하늘 · 조명) ----------
const sunDir = new THREE.Vector3();
const FOG = { day: new THREE.Color(0xb7c6d6), dusk: new THREE.Color(0xc9a184), night: new THREE.Color(0x0b0f18) };
let envTimer = 0;
function setTime(h) {
  const elev = 60 * Math.sin(Math.PI * (h - 6) / 12);                 // 태양 고도(도)
  const az = THREE.MathUtils.degToRad(90 + (h - 6) / 12 * 180);        // 방위: 동 → 남 → 서
  const e = THREE.MathUtils.degToRad(elev);
  sunDir.set(Math.sin(az) * Math.cos(e), Math.sin(e), -Math.cos(az) * Math.cos(e));
  const day = smoothstep(elev, -4, 7), night = 1 - smoothstep(elev, -9, 0), low = 1 - smoothstep(elev, 4, 28);

  for (const s of [sky, envSky]) {
    const u = s.material.uniforms;
    u.sunPosition.value.copy(sunDir);
    u.turbidity.value = lerp(3, 7, low); u.rayleigh.value = lerp(1.1, 2.6, low);
    u.mieCoefficient.value = 0.004; u.mieDirectionalG.value = 0.82;
  }
  if (elev > -1) {
    sun.position.copy(sunDir).multiplyScalar(2600);
    sun.color.set(0xff9350).lerp(new THREE.Color(0xfff4e4), smoothstep(elev, 2, 30));
    sun.intensity = 2.0 * smoothstep(elev, -1, 7);
  } else {                                                             // 달빛
    sun.position.set(-900, 1700, 1100);
    sun.color.set(0x8fa6e8);
    sun.intensity = 0.55 * night;
  }
  hemi.intensity = lerp(0.22, 0.6, day);
  hemi.color.set(0x2a3a66).lerp(new THREE.Color(0xdfeaff), day);
  hemi.groundColor.set(0x1a1c22).lerp(new THREE.Color(0x8a8478), day);
  renderer.toneMappingExposure = lerp(0.7, 0.6, day);
  scene.fog.color.copy(FOG.night).lerp(FOG.dusk, smoothstep(elev, -10, 3)).lerp(FOG.day, smoothstep(elev, 3, 25));
  outerMat.color.copy(scene.fog.color).multiplyScalar(lerp(1.0, 0.86, day));
  buildingUniforms.uNight.value = night;
  lampMat.opacity = night; lampPool.opacity = night * 0.3; carLights.material.opacity = night;
  carLights.visible = night > 0.02;

  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  $('time-out').textContent = hh + ':' + String(mm).padStart(2, '0');
  clearTimeout(envTimer);
  envTimer = setTimeout(() => {                                         // 유리 반사용 환경맵 갱신
    const rt = pmrem.fromScene(envScene);
    scene.environment = rt.texture;
    if (envRT) envRT.dispose();
    envRT = rt;
  }, 60);
}
$('time').oninput = e => setTime(+e.target.value);
document.querySelectorAll('.presets button').forEach(b => b.onclick = () => { $('time').value = b.dataset.t; setTime(+b.dataset.t); });
setTime(15);

// ---------- 마우스 오버 ----------
const tip = $('tip');
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = -1, pending = null, dragging = false;
const HI = new THREE.Color(0x4f9dff);
function paint(slot, color) {
  const attr = buildingMesh.geometry.attributes.color, a = attr.array;
  for (let k = bStart[slot] * 3, e = bStart[slot + 1] * 3; k < e; k += 3) {
    if (color) { a[k] = color.r; a[k + 1] = color.g; a[k + 2] = color.b; }
    else { a[k] = baseColors[k]; a[k + 1] = baseColors[k + 1]; a[k + 2] = baseColors[k + 2]; }
  }
  attr.needsUpdate = true;
}
function slotOf(vertex) { let lo = 0, hi = bStart.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (bStart[m] <= vertex) lo = m; else hi = m; } return lo; }
function pick() {
  const ev = pending; pending = null;
  if (!ev || dragging) return;
  mouse.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(buildingMesh, false)[0];
  const slot = hit ? slotOf(hit.faceIndex * 3) : -1;
  if (slot !== hovered) {
    if (hovered >= 0) paint(hovered, null);
    if (slot >= 0) paint(slot, HI);
    hovered = slot;
  }
  if (slot < 0) { tip.style.display = 'none'; return; }
  const b = D.buildings[slot];
  const floors = Math.max(1, Math.round(b[0] / 3.2));
  tip.innerHTML = `<b></b><span>높이 약 ${b[0]}m · ${floors}층 내외${b[1] ? ' (추정)' : ''} · 바닥 ${Math.round(areaOf(b[3])).toLocaleString('ko-KR')}㎡</span>`;
  tip.firstChild.textContent = b[2] || '이름 없는 건물';
  tip.style.display = 'block';
  const w = tip.offsetWidth;
  tip.style.left = Math.min(innerWidth - w - 8, ev.clientX + 14) + 'px';
  tip.style.top = Math.max(8, ev.clientY - 46) + 'px';
}
renderer.domElement.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') pending = e; });
renderer.domElement.addEventListener('pointerleave', () => { pending = null; tip.style.display = 'none'; if (hovered >= 0) { paint(hovered, null); hovered = -1; } });
controls.addEventListener('start', () => { dragging = true; tip.style.display = 'none'; });
controls.addEventListener('end', () => { dragging = false; });

// ---------- UI ----------
const showGroup = (g, on) => { g.visible = on; g.children.forEach(o => { o.visible = on; }); };
$('t-labels').onchange = e => showGroup(labelGroup, e.target.checked);
$('t-exits').onchange = e => showGroup(exitGroup, e.target.checked);
$('t-cars').onchange = e => { carGroup.visible = e.target.checked; };
$('t-trees').onchange = e => { treeGroup.visible = e.target.checked; };
$('t-shadow').onchange = e => { sun.castShadow = e.target.checked; };
$('t-rotate').onchange = e => { controls.autoRotate = e.target.checked; };
$('t-height').onchange = e => {
  const on = e.target.checked;
  baseColors = on ? heightColors : realColors;
  buildingMesh.geometry.attributes.color.array.set(baseColors);
  buildingMesh.geometry.attributes.color.needsUpdate = true;
  buildingUniforms.uHeightMode.value = on ? 1 : 0;
  hovered = -1;
  $('legend').style.display = on ? 'block' : 'none';
};

const toggleUI = () => document.body.classList.toggle('ui-hidden');
$('b-hide').onclick = $('b-show').onclick = toggleUI;
addEventListener('keydown', e => { if ((e.key === 'h' || e.key === 'H' || e.key === 'ㅗ') && !e.ctrlKey && !e.metaKey && !e.altKey) toggleUI(); });

let fly = null;
function flyTo(pos, target, ms = 900) {
  fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, start: performance.now(), ms };
}
$('b-reset').onclick = () => flyTo(HOME.pos.clone(), HOME.target.clone());
$('b-top').onclick = () => flyTo(new THREE.Vector3(0, 2900, 1), new THREE.Vector3(0, 0, 0));
$('b-street').onclick = () => flyTo(new THREE.Vector3(-170, 130, 240), new THREE.Vector3(0, 10, 0));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

// 겹치는 라벨 숨기기 (간단한 화면 좌표 충돌 검사)
function declutter() {
  const boxes = [];
  for (const grp of [fixedGroup, exitGroup, labelGroup]) {
    if (!grp.visible) continue;
    for (const o of grp.children) {
      const el = o.element;
      el.style.opacity = '';
      if (el.style.display === 'none') continue;
      const r = el.getBoundingClientRect();
      if (grp !== fixedGroup && boxes.some(b => r.left < b.right && r.right > b.left && r.top < b.bottom && r.bottom > b.top)) { el.style.opacity = '0'; continue; }
      boxes.push(r);
    }
  }
}

let frame = 0, last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (fly) {
    const t = Math.min(1, (now - fly.start) / fly.ms), k = t * t * (3 - 2 * t);
    camera.position.lerpVectors(fly.p0, fly.p1, k);
    controls.target.lerpVectors(fly.t0, fly.t1, k);
    if (t >= 1) fly = null;
  }
  controls.update();
  // 멀리서 볼 때 바닥 층들이 깜빡이지 않도록 near 를 거리에 맞춘다
  const dist = camera.position.distanceTo(controls.target);
  const near = clamp(dist * 0.03, 1, 80);
  if (Math.abs(near - camera.near) > 0.5) { camera.near = near; camera.updateProjectionMatrix(); }
  if (carGroup.visible) updateCars(dt);
  if (pending) pick();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  if (frame++ % 6 === 0) declutter();
}
$('loading').remove();
requestAnimationFrame(tick);
window.__map = { scene, camera, controls, renderer, setTime };
</script>
